<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zuhause</title>
<meta name="viewport" content="width=1920">
<script>
// Updates come from the home server, so this module never needs reinstalling.
window.TV_BASE = "http://192.168.68.58:8123/local/tv/";
window.TV_BUST = String(new Date().getTime());
document.write('<link rel="stylesheet" href="' + window.TV_BASE + 'tv.css?t=' + window.TV_BUST + '">');
</script>
</head>
<body>
<div id="screen">
  <div id="main">
    <div id="top">
      <div id="left">
        <div id="clock">--:--</div>
        <div id="date"></div>
        <div id="greet"></div>
        <div id="chips"></div>
      </div>
      <div id="right">
        <div id="weather" class="card">
          <div id="w-temp">--</div>
          <div id="w-info">
            <div id="w-cond"></div>
            <div id="w-range"></div>
          </div>
        </div>
        <div id="flags"></div>
      </div>
    </div>
    <div id="ideas-title"></div>
    <div id="ideas"></div>
    <div id="apps"></div>
  </div>
  <div id="toast"></div>
  <div id="diag">
    <div id="diag-title"></div>
    <div id="diag-body"></div>
    <div id="diag-hint"></div>
  </div>
  <div id="offline"></div>
</div>
<script>window.TV_STATUS_URL = "http://192.168.68.58:8123/local/tv/status.js";</script>
<script>
// Fallback when the home server cannot be reached (tv.js missing): inline, no dependency on tv.css.
(function () {
  var shown = false;
  function lang() {
    var l = ((navigator.language || navigator.userLanguage || 'de') + '').slice(0, 2).toLowerCase();
    return (l === 'en' || l === 'es') ? l : 'de';
  }
  var T = {
    de: ['Heimserver nicht erreichbar – bitte später erneut öffnen.', 'Zurück-Taste beendet. OK = erneut versuchen.'],
    en: ['Home server unreachable – please open again later.', 'Back exits. OK = retry.'],
    es: ['Servidor no disponible – vuelve a abrir más tarde.', 'Atrás sale. OK = reintentar.']
  };
  function show() {
    if (shown || window.TV_LOADED) { return; }
    shown = true;
    var t = T[lang()];
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;left:0;top:0;width:1920px;height:1080px;z-index:99999;background:#0b0b12;color:#fff;font-family:sans-serif;text-align:center;padding-top:400px;box-sizing:border-box');
    d.innerHTML = '<div style="font-size:56px;margin-bottom:40px">' + t[0] + '</div><div style="font-size:34px;color:#aab">' + t[1] + '</div>';
    document.body.appendChild(d);
  }
  window.TV_FAIL = show;
  setTimeout(show, 8000);
  document.addEventListener('keydown', function (e) {
    if (window.TV_LOADED && !shown) { return; }
    var k = e.keyCode;
    if (k === 10009) {
      try { if (window.tizen && window.tizen.application) { window.tizen.application.getCurrentApplication().exit(); return; } } catch (e1) { }
      try { window.history.back(); } catch (e2) { }
    } else if (k === 13 && shown) {
      window.location.reload();
    }
  }, false);
})();
</script>
<script>document.write('<script src="' + window.TV_BASE + 'tv.js?t=' + window.TV_BUST + '" onerror="window.TV_FAIL&&window.TV_FAIL()"><\/script>');</script>
</body>
</html>
